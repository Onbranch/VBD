    const securityView=()=>top('Security mode','Set your mailbox protection level',{back:true,action:'none'})+scroll(`<p class="body-copy">Security settings help your household know when the mailbox is in use.</p>${[['Home','Mailbox alerts on, guest passes available'],['Away','Extra access alerts while you’re out'],['Vacation','Highest monitoring and delivery alerts']].map(([n,d])=>`<button class="option ${state.securityMode===n?'selected':''}" data-mode="${n}"><span class="radio"></span><span><strong>${n} mode</strong><span class="small">${d}</span></span></button>`).join('')}<button class="btn full" data-action="save-mode" style="margin-top:16px">Save security mode</button><div class="section-label">Security activity</div><section class="activity card">${state.events.map(eventRow).join('')}</section>`);
    const notificationSettingsView=()=>top('Notifications','Choose the alerts you receive',{back:true,action:'none'})+scroll(`<section class="menu-card card">${[['push','Push notifications','Delivery, access, and device alerts'],['email','Email summaries','Weekly delivery activity summary']].map(([id,title,desc])=>`<div class="menu-row"><span class="menu-icon">${ico('bell',18)}</span><span class="menu-text">${title}<span class="small">${desc}</span></span><button class="switch ${state.settings[id]?'on':''}" data-setting="${id}" role="switch" aria-checked="${state.settings[id]}"></button></div>`).join('')}</section><div class="section-label">Alert types</div><section class="menu-card card">${['Package deliveries','Guest pass activity','Mailbox offline','Low battery','Door left open','Security events'].map(x=>`<div class="menu-row"><span class="menu-text">${x}</span><button class="switch on" data-setting="misc" role="switch" aria-checked="true"></button></div>`).join('')}</section>`);
    const securitySettingsView=()=>top('Security settings','Protect your account',{back:true,action:'none'})+scroll(`<section class="menu-card card"><div class="menu-row"><span class="menu-icon">${ico('face',18)}</span><span class="menu-text">Face ID<span class="small">Use Face ID to confirm mailbox access</span></span><button class="switch ${state.settings.face?'on':''}" data-setting="face" role="switch" aria-checked="${state.settings.face}"></button></div>${menuRow('phone','Change passcode','Update your app passcode','passcode')}${menuRow('shield','Security event history','Review access and device events','history')}</section>`);
    const setupView=()=>{const s=state.setupStep;const heads=['Connect your mailbox','Join your Wi-Fi','Set your location','Turn on notifications','All set'];const inner=[`<div class="empty"><div class="empty-icon">${ico('box',26)}</div><h2>Let’s connect your mailbox</h2><p>Make sure your Onbranch mailbox is powered on and nearby.</p></div><section class="summary card row"><span class="activity-icon">${ico('bluetooth',18)}</span><span class="parcel-copy"><span class="summary-title">Onbranch Mailbox</span><span class="small">Device found · Signal strong</span></span><span class="pill">Ready</span></section>`,`<p class="body-copy">Choose a secure Wi-Fi network so your mailbox can stay connected.</p><button class="option selected"><span class="menu-icon">${ico('wifi',18)}</span><span class="parcel-copy"><strong>Home Wi-Fi</strong><span class="small">Connected · Strong signal</span></span><span class="radio"></span></button><button class="option"><span class="menu-icon">${ico('wifi',18)}</span><span class="parcel-copy"><strong>Onbranch-Setup</strong><span class="small">Mailbox setup network</span></span><span class="radio"></span></button>`,`<p class="body-copy">We use your location to confirm you’re near the mailbox before unlocking it.</p><section class="summary card row"><span class="activity-icon">${ico('pin',18)}</span><span class="parcel-copy"><span class="summary-title">123 Main Street</span><span class="small">Brooklyn, NY 11211</span></span><span class="chev">›</span></section>`,`<p class="body-copy">Get notified when packages arrive, a guest uses a pass, or your mailbox needs attention.</p><section class="summary card row"><span class="activity-icon">${ico('bell',18)}</span><span class="parcel-copy"><span class="summary-title">Allow notifications</span><span class="small">Delivery and security alerts</span></span><span class="pill">Enabled</span></section>`,`<div class="empty"><div class="empty-icon" style="background:#e9faf3;color:#19be80">${ico('check',26)}</div><h2>Your mailbox is ready</h2><p>You can now manage packages, access, and security from the home screen.</p></div>`];return top(heads[s],`Step ${Math.min(s+1,5)} of 5`,{back:true,action:'none'})+scroll(`${s<4?`<div class="stepper">${heads.slice(0,4).map((_,i)=>`<span class="step-dot ${i<=s?'active':''}"></span>`).join('')}</div>`:''}${inner[s]}<button class="btn full" data-action="setup-next" style="margin-top:15px">${s===4?'Go to home':'Continue'}</button>`)};
    const miscView=()=>{switch(state.screen){case'report':case'report-submitted':return reportView();case'unlock':return unlockView();case'unlock-success':case'lock-confirmation':case'lock-success':case'unlock-failed':return unlockResultView();case'detail':return detailView();case'settings':return settingsView();case'notifications':return notificationView();case'health':return healthView();case'pass':return passView();case'household':return householdView();case'invite':return inviteView();case'security':return securityView();case'notification-settings':return notificationSettingsView();case'security-settings':return securitySettingsView();case'setup':return setupView();case'history':return top('Access history','Recent mailbox access',{back:true,action:'none'})+scroll(`<section class="activity card">${state.events.map(eventRow).join('')}</section>`);case'help':return top('Help center','We’re here to help',{back:true,action:'none'})+scroll(`<section class="summary card"><div class="summary-title">How can we help?</div><div class="small" style="margin-top:5px">Browse common questions or contact our support team.</div></section><section class="menu-card card">${menuRow('box','Managing deliveries','Track and retrieve packages','help')}${menuRow('lock','Unlocking your mailbox','Access and safety','help')}${menuRow('users','Household and guest access','Invite people and manage passes','help')}${menuRow('wifi','Troubleshoot your mailbox','Connection, battery, camera','help')}</section><button class="btn full" data-action="contact-support">Contact support</button>`);case'plan':return top('Your plan','Onbranch Home',{back:true,action:'none'})+scroll(`<section class="plan-card featured"><span class="pill orange">CURRENT PLAN</span><h2 style="font-size:19px;margin:14px 0 4px">Onbranch Home</h2><div class="plan-price">$9 <span class="small">/ month</span></div><div class="small">Billed monthly · Renews October 22</div><div class="checkline">✓ &nbsp;Secure mailbox access</div><div class="checkline">✓ &nbsp;Delivery notifications</div><div class="checkline">✓ &nbsp;30-day camera history</div></section><section class="plan-card"><h2 style="font-size:17px;margin:0">Onbranch Plus</h2><div class="plan-price">$15 <span class="small">/ month</span></div><div class="checkline">✓ &nbsp;Everything in Home</div><div class="checkline">✓ &nbsp;90-day camera history</div><div class="checkline">✓ &nbsp;Package protection</div><button class="btn secondary full" data-action="upgrade">Explore plan</button></section>`);case'camera-settings':return top('Camera settings','Entry camera',{back:true,action:'none'})+scroll(`<section class="menu-card card">${[['Motion alerts','Push alerts for detected motion'],['Save event clips','Store motion clips for 30 days'],['Camera status light','Show when camera is recording']].map(([a,b])=>`<div class="menu-row"><span class="menu-icon">${ico('camera',18)}</span><span class="menu-text">${a}<span class="small">${b}</span></span><button class="switch on" data-setting="misc" role="switch"></button></div>`).join('')}</section>`);case'address':return top('Mailbox address','Home mailbox',{back:true,action:'none'})+scroll(`<section class="summary card"><div class="summary-title">123 Main Street</div><div class="small" style="margin-top:5px">Brooklyn, NY 11211</div></section><button class="btn secondary full" data-action="edit-address">Edit address</button>`);case'passcode':return top('Change passcode','Account security',{back:true,action:'none'})+scroll(`<label class="field-label">Current passcode</label><input class="field" inputmode="numeric" type="password" placeholder="••••••"><label class="field-label">New passcode</label><input class="field" inputmode="numeric" type="password" placeholder="6 digits"><button class="btn full" data-action="save-passcode" style="margin-top:18px">Update passcode</button>`);default:return settingsView()}};
    const content=()=>{if(state.screen)return miscView();switch(state.tab){case'packages':return packagesView();case'access':return accessView();case'camera':return cameraView();default:return homeView()}};
    const render=()=>{app.innerHTML=statusBar()+content()+foot()+(state.toast?`<div class="toast" role="status">${ico('check',17)} &nbsp;${h(state.toast)}</div>`:'')};
    const toast=msg=>{state.toast=msg;clearTimeout(state.toastTimer);render();state.toastTimer=setTimeout(()=>{state.toast='';render()},2500)};
    const go=(screen)=>{state.stack.push({screen:state.screen,tab:state.tab});state.screen=screen;render();document.getElementById('scrollArea')?.scrollTo(0,0)};
    const action=(name)=>{switch(name){case'unlock':if(state.unlocked){go('lock-confirmation');return}go('unlock');return;case'confirm-unlock':if(state.offline||state.unlockFailure){state.screen='unlock-failed';render();return}state.unlocked=true;state.events.unshift({icon:'unlock',title:'Mailbox unlocked',desc:'Just now · Dylan Reed'});state.notifications.unshift({icon:'unlock',title:'Mailbox unlocked',desc:'Just now · You unlocked the mailbox',fresh:true});state.screen='unlock-success';render();clearTimeout(state.autoLockTimer);state.autoLockTimer=setTimeout(()=>{state.unlocked=false;if(state.screen==='unlock-success'){state.screen=null;state.stack=[];render()}},30000);return;case'confirm-lock':state.unlocked=false;clearTimeout(state.autoLockTimer);state.events.unshift({icon:'lock',title:'Mailbox locked',desc:'Just now · Dylan Reed'});state.screen='lock-success';render();return;case'retry-unlock':state.unlockFailure=null;state.offline=false;state.screen='unlock';render();return;case'simulate-no-response':state.unlockFailure='no-response';state.offline=false;toast('No-response scenario enabled');break;case'simulate-phone-offline':state.unlockFailure='phone-offline';state.offline=false;toast('Phone-offline scenario enabled');break;case'clear-failure':state.unlockFailure=null;state.offline=false;toast('Failure scenario cleared');break;
      case'create-pass':state.passStep=0;state.passName='';state.passEmail='';state.passScope='Mailbox access';state.passDuration='24 hours';go('pass');return;
      case'invite':go('invite');return;case'retrieve':{const p=state.selected;if(p){p.status='Retrieved';state.events.unshift({icon:'box',title:'Package retrieved',desc:p.carrier+' · Just now'});toast('Package marked as retrieved')}break}
      case'track':toast('Delivery tracking is up to date');break;case'report':state.issueType='Package missing';state.issueNote='';go('report');return;case'submit-report':state.events.unshift({icon:'alert',title:'Delivery issue reported',desc:state.issueType+' · Just now'});state.notifications.unshift({icon:'alert',title:'Delivery issue submitted',desc:state.issueType+' · We’ll follow up soon',fresh:true});state.screen='report-submitted';render();return;case'demo-delivery':parcels.unshift({id:'sample-'+Date.now(),carrier:'Shop',cls:'shop',name:'New sample delivery',tracking:'TRK-2026-SAMPLE',eta:'Arriving today',date:'Today, 9:41 AM',status:'Out for delivery',place:'Entry camera',detail:'A sample parcel for the staging demo.'});toast('Sample delivery added');break;
      case'snapshot':toast('Snapshot saved to recent clips');break;case'record':toast('Camera clip saved');break;case'firmware':toast('Your mailbox is running the latest firmware');break;case'reconnect':state.offline=false;state.battery=Math.max(20,state.battery);toast('Mailbox reconnected successfully');break;case'toggle-offline':state.offline=!state.offline;if(state.offline)state.events.unshift({icon:'wifi',title:'Mailbox went offline',desc:'Just now · Device health alert'});toast(state.offline?'Offline state enabled':'Mailbox is online');break;case'low-battery':state.battery=12;state.notifications.unshift({title:'Low battery',desc:'Mailbox battery is at 12%',fresh:true,icon:'battery'});toast('Low battery alert added');break;case'refresh':toast(state.offline?'Still offline · Check Wi-Fi':'Device status refreshed');break;
      case'pass-next':if(state.passStep===0&&!state.passName.trim()){document.getElementById('passName')?.focus();toast('Add a name for this pass');break}if(state.passStep===4){state.passes.unshift({name:state.passName||state.passKind,scope:state.passScope,duration:'Expires in '+state.passDuration,active:true});state.events.unshift({icon:'users',title:'Guest pass created',desc:(state.passName||state.passKind)+' · Just now'});state.passStep++;render();break}state.passStep++;render();return;case'pass-done':state.tab='access';state.screen=null;state.stack=[];render();return;case'copy-link':toast('Secure guest link copied');break;case'show-qr':toast('Guest pass QR code is ready');break;case'save-mode':toast(state.securityMode+' mode saved');break;
      case'send-invite':{const name=document.getElementById('inviteName')?.value||'Household member';const email=document.getElementById('inviteEmail')?.value;if(!email){toast('Enter an email address');break}state.events.unshift({icon:'users',title:'Household invitation sent',desc:name+' · Just now'});state.screen='household';toast('Invitation sent to '+email);return}
      case'read-all':state.notifications.forEach(n=>n.fresh=false);toast('Notifications marked as read');break;case'unread':state.notifications=state.notifications.filter(n=>n.fresh);render();return;case'member-menu':toast('Member options opened');break;case'upgrade':toast('Plan details opened');break;case'contact-support':toast('Support request started');break;case'edit-address':toast('Address settings opened');break;case'save-passcode':toast('Passcode updated');break;case'reset-demo':state.offline=false;state.unlocked=false;state.battery=86;state.events=[{icon:'box',title:'Package delivered',desc:'FedEx · Yesterday at 2:30 PM'},{icon:'unlock',title:'Mailbox locked',desc:'You secured the mailbox · Yesterday'},{icon:'camera',title:'Motion detected',desc:'Entry camera · Monday at 4:11 PM'}];state.notifications=[{title:'Package delivered',desc:'FedEx · Yesterday at 2:30 PM',fresh:true,icon:'box'},{title:'Access pass used',desc:'Dog walker · Today at 9:12 AM',fresh:true,icon:'unlock'},{title:'Mailbox battery is healthy',desc:'Battery level is 86%',fresh:false,icon:'battery'}];toast('Demo data reset');break;
      case'setup-next':if(state.setupStep<4){state.setupStep++;render();return}state.setupDone=true;state.screen=null;state.tab='home';state.stack=[];toast('Mailbox setup complete');return;
      default:toast('This demo setting is ready to configure')}
      render()};
    app.addEventListener('click',e=>{const el=e.target.closest('[data-tab],[data-screen],[data-parcel],[data-action],[data-back],[data-subtab],[data-pass-kind],[data-pass-scope],[data-pass-duration],[data-mode],[data-setting],[data-revoke],[data-notification],[data-schedule],[data-issue]');if(!el)return;
      if(el.dataset.tab){state.tab=el.dataset.tab;state.screen=null;state.stack=[];render();return}if(el.hasAttribute('data-back')){if(state.screen==='pass'&&state.passStep>0){state.passStep--;render();return}const prior=state.stack.pop();state.screen=prior?.screen??null;if(prior?.tab)state.tab=prior.tab;render();return}
      if(el.dataset.screen){if(['toggle-offline','low-battery','reconnect'].includes(el.dataset.screen))action(el.dataset.screen);else go(el.dataset.screen);return}if(el.dataset.parcel){state.selected=parcels.find(p=>p.id===el.dataset.parcel)||parcels[0];go('detail');return}if(el.dataset.action==='add'&&state.tab==='packages'){action('demo-delivery');return}if(el.dataset.action==='add'&&state.tab==='access'){action('create-pass');return}if(el.dataset.action==='bell'){go('notifications');return}if(el.dataset.action&&el.dataset.action!=='none'){action(el.dataset.action);return}
      if(el.dataset.issue){state.issueType=el.dataset.issue;render();return}if(el.dataset.subtab){state.subtab=el.dataset.subtab;render();return}if(el.dataset.passKind){state.passKind=el.dataset.passKind;render();return}if(el.dataset.passScope){state.passScope=el.dataset.passScope;render();return}if(el.dataset.passDuration){state.passDuration=el.dataset.passDuration;render();return}if(el.dataset.mode){state.securityMode=el.dataset.mode;render();return}if(el.dataset.setting){let k=el.dataset.setting;if(k in state.settings)state.settings[k]=!state.settings[k];el.classList.toggle('on');el.setAttribute('aria-checked',String(el.classList.contains('on')));return}if(el.dataset.revoke){const pass=state.passes[Number(el.dataset.revoke)];if(pass){pass.active=false;toast(pass.name+' pass revoked')}return}if(el.dataset.notification){state.notifications[Number(el.dataset.notification)].fresh=false;toast(state.notifications[Number(el.dataset.notification)].title);return}if(el.dataset.schedule){document.querySelectorAll('[data-schedule]').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');return}
    });
    app.addEventListener('input',e=>{if(e.target.id==='issueNote')state.issueNote=e.target.value;if(e.target.id==='passName')state.passName=e.target.value;if(e.target.id==='passEmail')state.passEmail=e.target.value});
    app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-screen]'))e.target.click()});
    render();
  })();
  </script>
</body>
</html>
